<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaAI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#26396e,transparent 40%),#090f22;color:#f5f7ff;font:15px system-ui}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{padding:22px 16px;background:#080e20;border-right:1px solid #293657;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#638bff,#a36bff,#50ddec)}.muted{color:#9baaca}.new{padding:12px;border:0;border-radius:12px;background:linear-gradient(100deg,#4166db,#8659d7);color:white;font-weight:700}.label{font-size:10px;letter-spacing:1.5px;color:#7183a8}.nav{display:grid;gap:6px}.nav button{padding:11px;text-align:left;border:0;border-radius:10px;background:transparent;color:#bdc9e4}.nav button:hover,.nav .active{background:#1c2b50;color:white}.premium{margin-top:auto;border:1px solid #293657;background:#121c36;border-radius:14px;padding:14px}.premium button{width:100%;padding:9px;border:0;border-radius:9px;color:white;background:linear-gradient(90deg,#648cff,#a06dff)}main{display:flex;flex-direction:column;min-width:0}.top{height:66px;padding:0 28px;border-bottom:1px solid #293657;display:flex;align-items:center;justify-content:space-between}.content{width:min(950px,100%);margin:auto;padding:28px 24px;display:flex;flex-direction:column;flex:1}.hero{text-align:center;margin:25px 0}.orb{margin:auto auto 16px;width:75px;height:75px;border-radius:24px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#648cff,#a06dff,#50ddec);box-shadow:0 12px 45px #718aff55}.hero h1{font-size:clamp(28px,4vw,42px);margin:0}.grad{background:linear-gradient(90deg,#8eb1ff,#c49aff,#70e7ed);background-clip:text;color:transparent}.hero p{color:#9baaca}.suggest{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:780px;margin:0 auto 22px;width:100%}.suggest button{padding:14px;text-align:left;border:1px solid #293657;border-radius:13px;background:#121d38;color:white}.suggest span{display:block;color:#9baaca;font-size:12px}.chat{display:flex;flex-direction:column;gap:14px;flex:1}.msg{display:flex;gap:10px;max-width:90%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 15px;border:1px solid #293657;border-radius:4px 15px 15px 15px;background:#121d38}.user .bubble{background:linear-gradient(130deg,#3454bb,#6147a7);border:0}.mini{width:30px;height:30px;flex:none;border-radius:10px;background:linear-gradient(135deg,#648cff,#a06dff);display:grid;place-items:center}.composer{margin-top:22px;padding:12px;border:1px solid #34466f;border-radius:17px;background:#111b34}.tools{display:flex;gap:10px;margin-bottom:8px;align-items:center}.tools select{padding:7px;background:#1b2948;color:white;border:1px solid #354b78;border-radius:9px}.tools small{color:#9baaca}.entry{display:flex;gap:10px;align-items:end}.entry textarea{flex:1;min-height:48px;resize:vertical;background:transparent;border:0;outline:0;color:white;padding:12px}.send{width:46px;height:46px;border:0;border-radius:12px;color:white;background:linear-gradient(135deg,#648cff,#a06dff);font-size:20px}.notice{margin-bottom:12px;padding:12px;background:#2b2619;border:1px solid #675a36;border-radius:12px;color:#ead8a6}.hide{display:none}.foot{text-align:center;color:#7584a3;font-size:11px;margin-top:10px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:18px 13px}.suggest{grid-template-columns:1fr}.top{padding:0 15px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">N</div>NovaAI</div><button class="new" id="new">＋ Yeni söhbət</button><div><div class="label">İŞ SAHƏSİ</div><div class="nav"><button class="active" data-mode="chat">✦　AI Söhbət</button><button data-mode="code">⌘　Kod köməkçisi</button><button data-mode="image">▧　Şəkil yarat</button><button data-mode="video">▶　Video yarat</button></div></div><div><div class="label">ŞƏXSİ</div><div class="nav"><button data-mode="history">◷　Tarixçə</button><button data-mode="profile">◉　Profil</button><button data-mode="settings">⚙　Parametrlər</button></div></div><div class="premium"><b>NovaAI Premium</b><p class="muted">Əlavə imkanları kəşf et.</p><button id="premium">Premium-u kəşf et</button></div></aside><main><header class="top"><span class="muted">NovaAI　/　<b id="section">AI Söhbət</b></span><span class="muted">● Sistem hazırdır</span></header><section class="content"><div id="notice" class="notice hide"></div><div class="hero" id="hero"><div class="orb">✦</div><h1>Salam, <span class="grad">NovaAI</span>-yə xoş gəldin</h1><p>Fikirlərini reallaşdır. Sual ver, öyrən, yarat və kəşf et.</p></div><div class="suggest" id="suggest"><button data-prompt="Mənə müasir veb sayt üçün ideyalar ver."><b>✧ Kreativ ideyalar</b><span>Yeni layihə üçün ilham tap</span></button><button data-prompt="JavaScript-i yeni başlayan üçün izah et."><b>⌘ Kod öyrən</b><span>Proqramlaşdırmanı addım-addım öyrən</span></button><button data-prompt="Maraqlı bir mövzu seç və mənə öyrət."><b>✦ Yeni bir şey öyrən</b><span>Biliklərini genişləndir</span></button></div><div class="chat" id="chat"></div><div class="composer"><div class="tools"><select id="provider"><option value="groq">Groq</option><option value="gemini">Google Gemini</option><option value="cometapi">CometAPI</option></select><small id="hint">Model seç və söhbətə başla</small></div><div class="entry"><textarea id="prompt" placeholder="NovaAI-dən nə soruşmaq istəyirsən?"></textarea><button class="send" id="send">➤</button></div></div><div class="foot">NovaAI səhv edə bilər. Vacib məlumatları yoxlamağı unutma.</div></section></main></div><script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#prompt");let msgs=[],mode="chat";function note(t){$("#notice").textContent=t;$("#notice").classList.remove("hide")}function add(role,t){let r=document.createElement("div");r.className="msg "+(role==="user"?"user":"");let a=document.createElement("div");a.className="mini";a.textContent=role==="user"?"S":"✦";let b=document.createElement("div");b.className="bubble";b.textContent=t;r.append(a,b);chat.append(r);$("#hero").classList.add("hide");$("#suggest").classList.add("hide")}function reset(){msgs=[];chat.innerHTML="";$("#hero").classList.remove("hide");$("#suggest").classList.remove("hide");$("#notice").classList.add("hide")}async function send(t){t=(t||input.value).trim();if(!t)return;if(mode==="image"||mode==="video"){note(mode==="image"?"Şəkil yaratma üçün ayrıca image API inteqrasiyası lazımdır.":"Video yaratma üçün ayrıca video API inteqrasiyası lazımdır.");return}if(["history","profile","settings"].includes(mode)){note("Bu bölmə ilkin maketdir. Hesab və verilənlər bazası hələ qoşulmayıb.");return}input.value="";msgs.push({role:"user",content:t});add("user",t);let w=document.createElement("div");w.className="msg";w.textContent="NovaAI düşünür...";chat.append(w);$("#send").disabled=true;try{let sys=mode==="code"?"Sən NovaAI kod köməkçisisən. Azərbaycan dilində cavab ver, kodu Markdown blokunda göstər.":"Sən NovaAI adlı faydalı AI köməkçisisən. Azərbaycan dilində aydın cavab ver.";let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:$("#provider").value,messages:[{role:"system",content:sys},...msgs]})});let d=await r.json();if(!r.ok)throw Error(d.error||"Sorğu alınmadı");msgs.push({role:"assistant",content:d.answer});w.remove();add("assistant",d.answer);localStorage.setItem("novaai_history",JSON.stringify(msgs))}catch(e){w.remove();add("assistant","Xəta: "+e.message);msgs.pop()}finally{$("#send").disabled=false}}$("#send").onclick=()=>send();input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#new").onclick=reset;document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>send(b.dataset.prompt));document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));$("#section").textContent=b.textContent.trim();$("#notice").classList.add("hide");if(mode==="image")note("Şəkil generasiyası üçün ayrıca image API lazımdır.");if(mode==="video")note("Video generasiyası üçün ayrıca video API lazımdır.");if(["history","profile","settings"].includes(mode))note("Bu bölmə ilkin maketdir; əlavə backend işi tələb olunur.")});$("#premium").onclick=()=>note("Premium ödəniş sistemi hələ qoşulmayıb.");
</script></body></html>
