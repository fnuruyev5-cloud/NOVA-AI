<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova AI</title>
<link rel="icon" href="logo-dark.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side"><button id="nc"></button><ul id="list"></ul></aside>
<main>
  <header>
    <button id="menu">☰</button>
    <img class="logo" alt=""><b>Nova AI</b>
    <button id="lgb" title="Logo Studio">✦</button><button id="gear">⚙</button>
  </header>
  <section id="msgs"></section>
  <div id="st"></div>
  <div id="bar">
    <button id="mic">🎤</button><button id="vc">🎧</button><button id="cam">📷</button>
    <button id="img">🖼</button>
    <button id="vid">🎬</button>
    <textarea id="in" rows="1"></textarea>
    <button id="go">➤</button>
  </div>
</main>
<div id="vo" class="ov" hidden><div id="orb"></div><div id="vt"></div><button id="vx">✕</button></div>
<div id="co" class="ov" hidden><video id="cv" autoplay playsinline muted></video><div id="ct"></div><div class="cb"><button id="cd">👁</button><button id="cm">🎤</button><button id="cx">✕</button></div></div>
<div id="lg" hidden><div class="lgw">
<div class="lgh"><b>✦ Logo Studio</b><button id="lgx">✕</button></div>
<div class="lgg"><div class="lgf">
<label>Brand / team / clan / company name</label><input id="ln" maxlength="60" autocomplete="off">
<label>Describe the logo style</label><textarea id="ld" rows="3" maxlength="500" placeholder="e.g. fierce wolf head, sharp angles, futuristic"></textarea>
<label>Category</label><div id="lc" class="chips"></div>
<label>Colors (up to 3)</label><div id="lk" class="chips"></div>
<label>Visual style</label><div id="ls" class="chips"></div>
<button id="lgo">Generate logo</button></div>
<div class="lgr"><div id="lbox"><span>Your logo will appear here</span></div><div id="lst" role="status"></div>
<div class="lga"><button id="lre" disabled>↻ Regenerate</button><button id="ldl" disabled>⬇ Download</button><button id="lsv" disabled>♡ Save</button></div>
<details><summary>Generated prompt</summary><pre id="lp"></pre></details>
<b>Saved logos</b><div id="lgal"></div></div></div></div></div>
<dialog id="dlg">
  <label id="l-theme"></label>
  <select id="s-theme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select>
  <label id="l-lang"></label>
  <select id="s-lang"><option value="az">Azərbaycanca</option><option value="tr">Türkçe</option><option value="ru">Русский</option><option value="en">English</option><option value="pt">Português</option></select>
  <label id="l-prov"></label>
  <select id="s-prov"><option value="groq">Groq</option><option value="gemini">Gemini</option><option value="comet">CometAPI</option></select>
  <label id="l-srv"></label>
  <input id="s-srv" placeholder="boş = eyni sayt">
  <p id="warn"></p>
  <form method="dialog"><button>OK</button></form>
</dialog>
<script src="app.js"></script>
</body>
</html>
