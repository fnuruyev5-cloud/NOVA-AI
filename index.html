<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d19"><title>NovaAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#293765,transparent 45%),#090d19;color:#eef3ff;font:15px system-ui,Arial}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#0a1020;border-right:1px solid #293653;padding:20px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}.brand img{width:43px;height:43px;object-fit:contain}.btn{border:0;border-radius:12px;padding:12px;background:linear-gradient(110deg,#587df2,#9965e5);color:white;font-weight:700}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#b9c6df;border:0;border-radius:10px;text-align:left;padding:11px}.nav button.active,.nav button:hover{background:#1a2945;color:#fff}.bottom{margin-top:auto;border:1px solid #34415e;background:#131e34;padding:14px;border-radius:14px}.main{min-width:0;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid #293653;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#9eacc7}.content{width:min(950px,100%);padding:25px;margin:auto;flex:1;display:flex;flex-direction:column}.hero{text-align:center;margin:7vh auto 25px}.logo{width:90px;height:90px;border:1px solid #52658a;border-radius:26px;background:#182644;display:grid;place-items:center;margin:auto auto 18px}.logo img{width:72px;height:72px;object-fit:contain}.hero h1{font-size:clamp(30px,5vw,48px);margin:0}.grad{background:linear-gradient(90deg,#9dbbff,#c69cff,#75e7e8);background-clip:text;color:transparent}.hero p{color:#9eacc7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#121d32;border:1px solid #2a3957;border-radius:14px;padding:16px;text-align:left;color:#fff}.card small{display:block;color:#9eacc7;margin-top:5px}.chat{display:flex;flex-direction:column;gap:14px;flex:1}.msg{max-width:88%;display:flex;gap:10px}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 15px;border:1px solid #2c3a58;border-radius:4px 15px 15px 15px;background:#142039}.user .bubble{background:linear-gradient(130deg,#3656b6,#64489c);border:0}.ico{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#648cff,#a36be7);display:grid;place-items:center;flex:none}.composer{margin-top:22px;background:#121d32;border:1px solid #3b4d72;border-radius:17px;padding:12px}.composer select{background:#1b2945;color:white;border:1px solid #3a4a6b;border-radius:8px;padding:7px}.entry{display:flex;gap:10px;align-items:end}.entry textarea{flex:1;min-height:48px;resize:vertical;background:transparent;border:0;outline:0;color:white;padding:12px}.send{width:45px;height:45px;border:0;border-radius:12px;background:linear-gradient(135deg,#648cff,#a36be7);color:white;font-size:20px}.notice{padding:12px;border-radius:10px;background:#332b1a;color:#f2dda7;margin-bottom:12px}.hidden{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:17px 13px}.cards{grid-template-columns:1fr}.top{padding:0 14px}.hero{margin:5vh auto 20px}.msg{max-width:96%}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="/assets/novaai-logo.png" alt="NovaAI">NovaAI</div><button class="btn" id="new">＋ Yeni söhbət</button><div><div style="color:#8291ad;font-size:11px;margin:0 0 8px 8px">WORKSPACE</div><div class="nav"><button class="active">✦　AI Söhbət</button><button id="code">⌘　Kod köməkçisi</button><button id="image">▧　Şəkil studiyası</button><button id="video">▶　Video studiyası</button><button id="history">◷　Tarixçə</button><button id="profile">◉　Profil</button><button id="settings">⚙　Parametrlər</button></div></div><div class="bottom"><b>✧ NovaAI Plus</b><p style="color:#9eacc7;font-size:12px">Yeni imkanlar tezliklə.</p></div></aside><main class="main"><header class="top"><b>NovaAI / AI Söhbət</b><span>● Sistem hazırdır</span></header><section class="content"><div id="notice" class="notice hidden"></div><div class="hero" id="hero"><div class="logo"><img src="/assets/novaai-logo.png" alt="NovaAI"></div><h1>Fikirlərini <span class="grad">gerçəyə çevir.</span></h1><p>Yarat, öyrən, kodlaşdır və kəşf et.</p><div class="cards"><button class="card" data-prompt="Mənə yaradıcı layihə ideyaları ver.">✧ Kreativ ideyalar<small>Yeni layihənə ilham tap</small></button><button class="card" data-prompt="Mənə JavaScript öyrət.">⌘ Kod öyrən<small>Proqramlaşdırmada kömək al</small></button><button class="card" data-prompt="Mənə maraqlı bir mövzu öyrət.">◈ Yeni biliklər<small>Kəşf etməyə başla</small></button></div></div><div class="chat" id="chat"></div><div class="composer"><select id="provider"><option value="groq">Groq AI</option><option value="gemini">Google Gemini</option><option value="cometapi">CometAPI</option></select><div class="entry"><textarea id="prompt" placeholder="NovaAI-yə mesaj yaz..."></textarea><button class="send" id="send">➤</button></div></div></section></main></div>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#prompt");let messages=[],mode="chat";
function notice(t){$("#notice").textContent=t;$("#notice").classList.remove("hidden")}
function draw(role,text){let row=document.createElement("div");row.className="msg "+(role==="user"?"user":"");let icon=document.createElement("div");icon.className="ico";icon.textContent=role==="user"?"S":"✦";let b=document.createElement("div");b.className="bubble";b.textContent=text;row.append(icon,b);chat.append(row);$("#hero").classList.add("hidden")}
function reset(){messages=[];chat.innerHTML="";$("#hero").classList.remove("hidden");$("#notice").classList.add("hidden")}
async function send(t){t=(t??input.value).trim();if(!t)return;if(mode==="image"||mode==="video"){notice("Bu studiya üçün ayrıca generasiya API-si qoşulmalıdır.");return}input.value="";messages.push({role:"user",content:t});draw("user",t);let wait=document.createElement("div");wait.className="msg";wait.textContent="NovaAI cavab hazırlayır...";chat.append(wait);$("#send").disabled=true;try{let sys=mode==="code"?"Sən NovaAI kod köməkçisisən. Azərbaycan dilində cavab ver.":"Sən NovaAI adlı faydalı AI köməkçisisən. Azərbaycan dilində cavab ver.";let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:$("#provider").value,messages:[{role:"system",content:sys},...messages]})});let d=await r.json();if(!r.ok)throw Error(d.error||"Sorğu alınmadı");wait.remove();messages.push({role:"assistant",content:d.answer});draw("assistant",d.answer)}catch(e){wait.remove();draw("assistant","Xəta: "+e.message);messages.pop()}finally{$("#send").disabled=false}}
$("#send").onclick=()=>send();input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#new").onclick=reset;document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>send(b.dataset.prompt));$("#code").onclick=()=>mode="code";["image","video"].forEach(x=>$("#"+x).onclick=()=>{mode=x;notice(x==="image"?"Şəkil yaratma üçün ayrıca API lazımdır.":"Video yaratma üçün ayrıca API lazımdır.")});["history","profile","settings"].forEach(x=>$("#"+x).onclick=()=>notice("Bu funksiya üçün istifadəçi hesabı və verilənlər bazası inteqrasiyası lazımdır."));
</script></body></html>
