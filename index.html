<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d19"><title>NovaAI — AI Workspace</title>
<style>
:root{--bg:#090d19;--panel:#101727;--panel2:#151f32;--line:#25334d;--text:#eef3ff;--muted:#8c9ab4;--blue:#7798ff;--violet:#a77aff;--cyan:#65d9e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -20%,#26315a 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,Arial}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:265px minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;background:#0a1020eF;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;z-index:5}.brand{display:flex;align-items:center;gap:10px;padding:4px 7px 12px}.brand img{width:43px;height:43px;object-fit:contain}.brand strong{font-size:20px;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.primary,.send{border:0;background:linear-gradient(115deg,#5579ed,#9564df);box-shadow:0 8px 24px #667fff25;color:white;font-weight:700}.primary{border-radius:12px;padding:12px}.navlabel{font-size:10px;letter-spacing:1.7px;color:#71809c;padding:0 10px 5px}.nav{display:grid;gap:4px}.nav button,.history button{width:100%;border:0;background:transparent;color:#b5c1d9;text-align:left;padding:10px 11px;border-radius:10px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active,.history button:hover{background:#1a2943;color:white}.ico{width:19px;text-align:center;font-size:16px}.history{display:grid;gap:3px;overflow:auto}.history button{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebottom{margin-top:auto}.plan{border:1px solid #35415c;border-radius:14px;padding:13px;background:linear-gradient(145deg,#18223a,#12182a)}.plan b{font-size:13px}.plan p{font-size:11px;color:var(--muted);margin:5px 0 10px}.plan button{width:100%;border:1px solid #596b9a;background:#202d4a;border-radius:9px;padding:8px;font-size:12px}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#0b1120a8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:4}.crumb{color:var(--muted)}.crumb b{color:#eaf0ff}.topright{display:flex;align-items:center;gap:12px}.status{font-size:11px;color:#8ddbbd}.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#648cff,#b06fff);display:grid;place-items:center;font-weight:800}.mobilebrand,.menu{display:none}.workspace{width:min(1050px,100%);margin:0 auto;padding:32px 28px 24px;display:flex;flex-direction:column;flex:1}.welcome{text-align:center;margin:7vh auto 26px;max-width:700px}.emblem{width:88px;height:88px;margin:0 auto 20px;border:1px solid #52658b;border-radius:26px;background:linear-gradient(145deg,#1c2c4b,#171c35);display:grid;place-items:center;box-shadow:0 14px 60px #5979d52b}.emblem img{width:68px;height:68px;object-fit:contain}.welcome h1{font-size:clamp(30px,4vw,48px);line-height:1.12;letter-spacing:-1.6px;margin:0}.gradient{background:linear-gradient(90deg,#9bbaff,#c19bff,#7ce5e8);background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:15px;margin:14px 0 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}.feature{padding:15px;border:1px solid var(--line);border-radius:15px;background:#111a2b;min-height:105px;text-align:left}.feature:hover{border-color:#627dc2;transform:translateY(-2px)}.feature .ficon{font-size:19px}.feature b{display:block;margin:7px 0 2px;font-size:13px}.feature small{color:var(--muted);font-size:11px}.chat{display:flex;flex-direction:column;gap:19px;flex:1;padding:15px 0 25px}.message{display:flex;gap:11px;max-width:88%;align-items:flex-start}.message.user{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:13px 16px;background:#141e31;border:1px solid #293954;border-radius:4px 16px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#354e9c,#58418d);border:0;border-radius:16px 4px 16px 16px}.bubble pre{white-space:pre-wrap;overflow:auto;background:#080e19;border:1px solid #2b3850;border-radius:9px;padding:12px}.boticon{width:31px;height:31px;flex:none;border-radius:10px;background:linear-gradient(135deg,#668bff,#a36be7);display:grid;place-items:center}.composerwrap{position:sticky;bottom:0;padding:12px 0 0;background:linear-gradient(transparent,var(--bg) 18%)}.composer{border:1px solid #394b70;border-radius:18px;background:#121b2d;padding:11px 13px;box-shadow:0 12px 45px #0004}.composemeta{display:flex;align-items:center;gap:8px;margin-bottom:5px}.composemeta select{background:#1b2943;color:#dce6ff;border:1px solid #334564;border-radius:8px;padding:6px 9px;font-size:11px}.composemeta span{font-size:11px;color:var(--muted)}.entry{display:flex;gap:10px;align-items:flex-end}.entry textarea{flex:1;min-height:48px;max-height:180px;resize:vertical;background:transparent;border:0;outline:0;color:white;padding:10px 3px}.send{width:43px;height:43px;border-radius:13px;font-size:20px}.send:disabled{opacity:.5}.hint{text-align:center;color:#73819c;font-size:10px;margin:8px 0}.notice{border:1px solid #806a37;background:#302a1b;color:#f1dba2;padding:12px;border-radius:12px;margin:10px 0}.hidden{display:none!important}.pagepanel{border:1px solid var(--line);background:#111a2b;border-radius:18px;padding:24px;max-width:760px;margin:30px auto;width:100%}.pagepanel h2{margin-top:0}.pagepanel p{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select{background:#0c1424;border:1px solid #34425d;color:white;border-radius:10px;padding:11px}.mobilebar{display:none}
@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:265px;transition:left .2s;box-shadow:20px 0 60px #0008}.sidebar.open{left:0}.menu,.mobilebrand{display:block}.topbar{padding:0 15px}.workspace{padding:22px 14px 18px}.welcome{margin:5vh auto 20px}.cards{grid-template-columns:1fr}.feature{min-height:78px}.message{max-width:96%}.status{display:none}.mobilebrand{font-weight:800}.mobilebrand img{width:28px;height:28px;vertical-align:middle}.topright{gap:8px}}
</style></head><body>
<div class="shell"><aside class="sidebar" id="sidebar">
<div class="brand"><img src="/assets/novaai-logo.png" alt="NovaAI logo"><div><strong>NovaAI</strong><small>INTELLIGENCE SPACE</small></div></div>
<button class="primary" id="newChat">＋　Yeni söhbət</button>
<div><div class="navlabel">WORKSPACE</div><nav class="nav">
<button class="active" data-page="chat"><span class="ico">✦</span> AI Söhbət</button>
<button data-page="code"><span class="ico">⌘</span> Kod köməkçisi</button>
<button data-page="image"><span class="ico">▧</span> Şəkil studiyası</button>
<button data-page="video"><span class="ico">▶</span> Video studiyası</button>
</nav></div>
<div><div class="navlabel">SÖHBƏTLƏR</div><div class="history" id="history"><button>Hələ söhbət yoxdur</button></div></div>
<div><div class="navlabel">HESAB</div><nav class="nav"><button data-page="profile"><span class="ico">◉</span> Profil</button><button data-page="settings"><span class="ico">⚙</span> Parametrlər</button></nav></div>
<div class="sidebottom"><div class="plan"><b>✧ NovaAI Plus</b><p>Daha çox imkan, daha böyük yaradıcılıq.</p><button id="plus">Planları kəşf et</button></div></div>
</aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu" id="menu" style="background:none;border:0;font-size:21px">☰</button><span class="mobilebrand"><img src="/assets/novaai-logo.png" alt=""> NovaAI</span><span class="crumb" id="crumb">Workspace / <b>AI Söhbət</b></span></div><div class="topright"><span class="status">● Sistem hazırdır</span><div class="avatar">N</div></div></header>
<section class="workspace"><div id="notice" class="notice hidden"></div>
<div class="welcome" id="welcome"><div class="emblem"><img src="/assets/novaai-logo.png" alt="NovaAI"></div><h1>Fikirlərini <span class="gradient">gerçəyə çevir.</span></h1><p>Yarat, öyrən, kodlaşdır və kəşf et. Sənin AI məkanın.</p><div class="cards">
<button class="feature" data-prompt="Mənə kreativ layihə ideyaları ver."><span class="ficon">✧</span><b>Kreativ ideyalar</b><small>Yeni layihənə ilham tap</small></button>
<button class="feature" data-prompt="Mənə müasir veb sayt üçün HTML, CSS və JavaScript nümunəsi yaz."><span class="ficon">⌘</span><b>Kod yaz və öyrən</b><small>Proqramlaşdırmada kömək al</small></button>
<button class="feature" data-prompt="Mənə maraqlı bir mövzu öyrət."><span class="ficon">◈</span><b>Nələr mümkündür?</b><small>Yeni biliklər kəşf et</small></button>
</div></div>
<div class="chat" id="chat"></div>
<div class="composerwrap"><div class="composer"><div class="composemeta"><select id="provider"><option value="groq">Groq AI</option><option value="gemini">Google Gemini</option><option value="cometapi">CometAPI</option></select><span>Model seçimi</span></div><div class="entry"><textarea id="prompt" rows="1" placeholder="NovaAI-yə mesaj yaz..."></textarea><button class="send" id="send" title="Göndər">➤</button></div></div><div class="hint">Enter — göndər · Shift + Enter — yeni sətir</div></div>
</section></main></div>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#prompt");let messages=[],page="chat",threads=JSON.parse(localStorage.getItem("novaai_threads")||"[]");
function notify(t){$("#notice").textContent=t;$("#notice").classList.remove("hidden")}
function saveThread(){if(!messages.length)return;let title=(messages.find(m=>m.role==="user")?.content||"Yeni söhbət").slice(0,34);threads.unshift({title,messages});threads=threads.slice(0,30);localStorage.setItem("novaai_threads",JSON.stringify(threads));renderHistory()}
function renderHistory(){$("#history").innerHTML="";if(!threads.length){$("#history").innerHTML="<button>Hələ söhbət yoxdur</button>";return}threads.forEach((t,i)=>{let b=document.createElement("button");b.textContent="◷　"+t.title;b.onclick=()=>{messages=t.messages.slice();chat.innerHTML="";messages.forEach(m=>draw(m.role,m.content));$("#welcome").classList.add("hidden");};$("#history").append(b)})}
function draw(role,text){let row=document.createElement("div");row.className="message "+(role==="user"?"user":"");let icon=document.createElement("div");icon.className="boticon";icon.textContent=role==="user"?"S":"✦";let bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.append(icon,bubble);chat.append(row);$("#welcome").classList.add("hidden")}
function reset(){if(messages.length)saveThread();messages=[];chat.innerHTML="";$("#welcome").classList.remove("hidden");$("#notice").classList.add("hidden")}
async function send(value){let text=(value??input.value).trim();if(!text)return;if(page==="image"||page==="video"){notify(page==="image"?"Şəkil generasiyası üçün ayrıca image-generation API qoşulmalıdır. Bu versiyada studiya interfeysi hazırlanıb.":"Video generasiyası üçün ayrıca video-generation API qoşulmalıdır. Bu versiyada studiya interfeysi hazırlanıb.");return}if(["profile","settings"].includes(page)){notify("Bu bölmə interfeys olaraq hazırdır; istifadəçi hesabı və bulud verilənlər bazası ayrıca qurulmalıdır.");return}
input.value="";messages.push({role:"user",content:text});draw("user",text);let waiting=document.createElement("div");waiting.className="message";waiting.innerHTML='<div class="boticon">✦</div><div class="bubble">NovaAI cavab hazırlayır...</div>';chat.append(waiting);$("#send").disabled=true;
try{let sys=page==="code"?"Sən NovaAI kod köməkçisisən. Azərbaycan dilində cavab ver. Kod nümunələrini aydın izah et.":"Sən NovaAI adlı ağıllı, faydalı və mehriban AI köməkçisisən. Azərbaycan dilində aydın cavab ver.";let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:$("#provider").value,messages:[{role:"system",content:sys},...messages]})});let d=await r.json();if(!r.ok)throw Error(d.error||"Sorğu alınmadı");waiting.remove();messages.push({role:"assistant",content:d.answer});draw("assistant",d.answer);localStorage.setItem("novaai_current",JSON.stringify(messages));renderHistory()}catch(e){waiting.remove();draw("assistant","Xəta: "+e.message);messages.pop()}finally{$("#send").disabled=false}}
$("#send").onclick=()=>send();input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("#newChat").onclick=reset;$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>send(b.dataset.prompt));document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));let name=b.textContent.trim();$("#crumb").innerHTML="Workspace / <b>"+name+"</b>";$("#sidebar").classList.remove("open");$("#notice").classList.add("hidden");if(page==="image")notify("Şəkil studiyası: vizual interfeys hazırdır. Real generasiya üçün ayrıca image API açarı və inteqrasiyası lazımdır.");if(page==="video")notify("Video studiyası: vizual interfeys hazırdır. Real generasiya üçün ayrıca video API inteqrasiyası lazımdır.");if(["profile","settings"].includes(page))notify("Hesab bölməsi: UI hazırdır, autentifikasiya və verilənlər bazası hələ qoşulmayıb.");});$("#plus").onclick=()=>notify("Ödəniş və abunə sistemi hələ inteqrasiya edilməyib.");renderHistory();
</script></body></html>
